  17-17-google-prefetch-par-categorie: done  # 2026-08-20 dev-story → review. Serveur seul. Le cout Google suit le NOMBRE DE TYPES interroges, pas les POI rapportes : un Text Search Pro est facture qu'il ramene 20 lieux ou zero. La selection de categories etait honoree a la lecture et ignoree a la collecte, donc le defaut produit (accommodations + hotel, identique web et mobile) payait 16 appels pour une demande qui en justifiait 6. Correctif : CATEGORY_GOOGLE_TYPES devient la source de verite (remplace GOOGLE_PLACE_TYPES, exportee mais JAMAIS utilisee et divergente — elle contenait food et supermarket absents de LAYER_GOOGLE_TYPES, et faisait pointer shelter sur lodging) ; LAYER_GOOGLE_TYPES en est derivee, un test verrouille la partition ; searchLayerPlaces → searchPlacesByType retourne l'issue PAR TYPE (le dedoublonnage place_id remonte dans le service). Marqueurs de couverture au grain TYPE (pois:google:seg:{id}:type:{type}:bbox:{k}) — sans quoi marquer le calque apres n'avoir cherche que « hotel » gelerait « camping » a zero pendant 7 j ; corrige aussi un bug preexistant d'echec partiel (15 types morts sur 16 laissaient le calque marque couvert). Shim de lecture des marqueurs :layer: herites pendant leur TTL residuelle → pas de re-paiement des zones deja couvertes (decision Guillaume). shelter → 0 appel Google (refuges = OSM). Mesure : defaut 6 appels au lieu de 16, 0,19 $ au lieu de 0,51 $ par bbox froide, 833 bboxes gratuites/mois au lieu de 312. Effet assume et valide par Guillaume : le filtre devient reellement filtrant, le jeu « hotel seul » peut legerement retrecir. LOT 2 (meme jour) : le lot 1 n'economisait RIEN — en planning web et mobile envoyaient categories: LAYER_CATEGORIES[layer] en entier, les puces de sous-types n'etant qu'un filtre d'affichage, donc le serveur recevait toujours les 5 categories et interrogeait les 16 types. Le test « n'interroge que les types demandes » passait en appelant le service avec categories:['hotel'], situation qu'aucun client ne produisait : contrat serveur verifie, code client jamais. Symptome remonte par Guillaume : « Chambre d'hote (1) » affiche alors que seuls Hotel et Camping etaient coches. Correctifs parite web+mobile : categories = visibleLayers x activeAccommodationTypes (un calque sans sous-type coche n'est plus interroge), signature de categories triee AJOUTEE A LA CLE TanStack Query (sinon cocher « Camping » puis relancer retombe sur l'entree « Hotel seul » sans requete), onlyCountActive en planning (une puce non cochee n'affiche plus « (0) »), toggleAccommodationType/resetAccommodationTypes degagent searchCommitted. Consequence visible validee par Guillaume : cocher un type ne filtre plus instantanement, il faut recliquer sur Rechercher. Gate : api 481/481 · web 1182/1182 · mobile 657/657 (96 suites) · shared 41/41 · tsc api+mobile 0 · tsc web 86 (identique avant/apres, verifie par git stash) · eslint 0 erreur. | 2026-08-20 DONE — T8 valide par Guillaume en local (recherche conforme, plus de compteur sur les sous-types non coches). Non deploye a ce stade.
  MOB-7-1-slider-gesture-scroll-conflict: review  # 2026-08-21 dev-story → review. Retour Guillaume : sliders quasi inutilisables, le geste bascule sur le volet lateral apres quelques pixels. Cause : les deux PanResponder (Slider, RangeSlider) ne declaraient ni onPanResponderTerminationRequest ni onShouldBlockNativeResponder — PanResponder ACCORDE la terminaison par defaut, donc le ScrollView parent (PlanningSidebar, drawer de filtres live) reclame et obtient le responder des la moindre derive verticale. Correctif a deux niveaux : negociation JS (refus de terminaison + blocage natif Android) ET verrou de defilement natif (ScrollLockProvider, render prop, no-op sans provider) car sur iOS le UIScrollView peut preempter hors de la negociation JS. Verrou leve sur release ET terminate (sinon panneau fige apres un geste interrompu). 5 tests de non-regression. Gate : mobile 674/674 (97 suites) · tsc 0 · eslint 0 erreur. ⏳ T6 validation simulateur.
  17-18-auto-generate-stages: review  # 2026-08-20 story creee (create-story), REVISEE le meme jour apres proposition Guillaume. Generation automatique des etapes en mode planning : formulaire km/jour + D+ max par etape + types d'hebergement, puis l'API decoupe l'aventure en verifiant qu'au moins 3 hebergements des types demandes sont detectes autour de chaque fin d'etape. Decisions Guillaume : endpoint API dedie synchrone (POST /adventures/:id/stages/generate) plutot que client ou BullMQ ; lot UNIQUE api+web+mobile (parite regle 10) ; candidat en echec = recul PUIS avance (0, -5, +5, ... -40, +40) — donc l'objectif km/jour devient une cible a +-40 km tandis que le D+ max reste une contrainte dure dans les deux sens (sinon le reglage D+ n'aurait plus d'effet des qu'un recul echoue) ; DETECTION VIA MASK_IDS_ONLY (Text Search Essentials, places.id seul) — gratuit et illimite, le but est de savoir S'IL Y A des hebergements, pas qui ils sont. Cette derniere decision a rendu obsolete la moitie de la conception initiale : celle-ci contournait le cout du masque Pro (0,19 $ par bbox froide → 102 appels / 3,26 $ pour evaluer les 17 candidats d'UNE etape) par une collecte en tranches de couloir de 50 km + fenetres paresseuses + set de couverture par run, pour un budget de 1,54 a 4,61 $ sur 800 km froids et 10-50 s de latence. En IDs Only : une requete par type et par candidat, en direct, 0 $, ~4 s pour 8 etapes (salve parallele de 6 requetes ~400 ms par candidat, mapWithConcurrency regle 8, comptages caches en Redis TTL 7 j). searchPlaceIds(bbox, type, textQuery) existe DEJA avec ce masque et passe par resolveTextQuery, donc le textQuery calibre par type (regle 11b) s'applique — pas de regression campground→0. Ne PAS reutiliser searchLayerPlaceIds telle quelle : elle prend un CALQUE (16 types au lieu des types demandes, annule 17.17) et avale les echecs. Trois consequences de l'IDs Only, ecrites dans la story : (1) pas de coordonnees retournees → le test devient une BBOX carree (cote 2r) et non un disque ST_DWithin, donc coin a 4,24 km pour un rayon de 3 → libelles « autour du point », jamais « dans un rayon de » ; buffer longitude corrige en cos(lat) (le chemin d'affichage divise les 2 axes par 111 km et sous-tamponne la longitude : 2,0 km au lieu de 3 a 48 degres — defaut preexistant → deferred-work) ; (2) rien n'est persiste dans accommodations_cache → la generation ne prechauffe plus la carte, et « 3 hebergements detectes » puis 2 pins n'est PAS un bug (bbox+place_id vs couloir+dedoublonnage) ; (3) UN ECHEC FOURNISSEUR N'EST PAS UN ZERO (leçon 17.13 regle 1, ou un 406 a masque 5 mois de panne Overpass) : countAt retourne { count, determinate }, un candidat indetermine est ecarte SANS compter comme un refus, aucun comptage indetermine n'est mis en cache, et si tous les candidats echouent le warning est provider_unavailable et jamais no_accommodation — deux tests dedies (T10 warning + zero ecriture Redis, T11 assertion sur X-Goog-FieldMask pour garder la gratuite). Complement gratuit lu en base : count = max(place_id Google, lignes accommodations_cache dans le rayon, join au niveau AVENTURE avec COUNT DISTINCT external_id+source car un POI existe sous plusieurs segment_id) — max et non somme, les ensembles se recoupent, minorant comme dans density-analyze.processor. Overpass exclu de la collecte (1-31 s x 8-24 verifications) mais ses lignes en cache comptent a la lecture selon overpassEnabled (regle 7) ; shelter n'a aucun type Google → zero appel, comptage porte par la base, avertissement formulaire. Deux autres constats de code integres : les etapes forment une CHAINE CONTIGUE depuis km 0 (append ou split, cascade sur delete) donc « completer les trous » ne peut vouloir dire que « prolonger apres la derniere etape » — le formulaire doit le dire ainsi ; le rayon appartient deja a l'utilisateur en planning depuis 17.16 (searchRadiusKm), la generation le consomme au lieu de re-coder 3 km en dur (regle 12). Garde-fous : MAX_GENERATED_STAGES_PER_CALL=14 + warning truncated, arret net sur tranche sans hebergement, derniere etape creee d'office jusqu'a la fin de trace (warning sparse_final_stage si < 3), contrainte D+ ignoree si le GPX n'a pas d'altitudes (warning no_elevation_data une seule fois). Risque principal deplace du cout vers le QUOTA DE DEBIT : IDs Only est gratuit mais pas exempt de QPM (pire cas theorique 14 x 17 x 6 = 1 428 requetes en moins d'une minute) → concurrence bornee a 6, cache Redis, et surtout un 429 doit produire provider_unavailable. Bascule BullMQ seulement si T14 mesure un p95 > 30 s. Hors perimetre explicite : departureTime des etapes generees reste null (donc la dialog de synchro de date de fin de 17.12 ne proposera rien avant saisie manuelle d'une heure de depart). T15 : amender la regle 11 du project-context — elle documente searchLayerPlaceIds (densite) comme seul chemin de comptage gratuit, la generation d'etapes en devient le second avec le meme interdit de bascule vers MASK_PRO. EXIGENCE COMPLEMENTAIRE Guillaume : « aucune requete payante » traite comme un INVARIANT OUTILLE et non une consigne en commentaire — le projet a deja perdu argent et temps exactement la (prefetch carte en masque Pro pendant 5 mois, 406 Overpass lu comme une absence). Etat des lieux : il n'existe que DEUX appels facturables dans toute l'API (pois.service.ts:238 getPlaceDetails → Place Details Pro, pois.service.ts:419 searchPlacesByType → Text Search Pro) ; density-analyze.processor:130 est deja gratuit ; la generation doit rester dans cette seconde famille. Cinq verrous : (1) point de decision de facturation unique — textSearch(mask) — avec resolveSku(mask) explicite ; (2) service injectable GoogleBillingCounter { free, billable } incremente dans textSearch ET dans getPlaceDetails, aucun autre chemin ne pouvant emettre vers Google ; (3) garde d'execution dans le generateur — snapshot avant/apres, delta > 0 → log error « FACTURATION INATTENDUE » + warning unexpected_billing + throw si NODE_ENV != production (log seul en prod : on ne casse pas une generation deja payee) ; (4) verrou de test sur X-Goog-FieldMask == exactement 'places.id,nextPageToken', sans places.location/displayName/types et sans pageToken dans le corps (T12) ; (5) verrou STATIQUE lisant le source de stage-generator.service.ts et echouant s'il contient PoisService, getPlaceDetails, searchPlacesByType, MASK_PRO ou PRO_FIELDS (T13) — grossier mais c'est le seul qui resiste au futur « je reutilise findPois, c'est deja ecrit », qui etait litteralement la conception de la veille. Defense en profondeur : plafond dur MAX_COUNT_REQUESTS_PER_GENERATION = 600 → warning request_budget_reached (borne aussi le quota de debit). countPlaceIdsForTypes n'expose AUCUN parametre mask a l'appelant. Log de fin de signature : « n etapes, n appels gratuits, 0 facture ». Tous les scenarios de T11 assertent billable == 0. RESERVE HONNETE a lever en T16 : la story s'appuie sur « Text Search Essentials IDs Only = 0,00 $ illimite » (c'est ce que documente le provider et la tarification actuelle), mais un plafond mensuel a deja existe sur les paliers Essentials — T16 verifie le RELEVE DE FACTURATION REEL apres une generation (SKU consomme, montant 0,00 $, absence de plafond applicable) ; si un plafond existe, le cache Redis des comptages et le plafond dur le rendent gerable mais il faudra le documenter dans la regle 11. AJOUT Guillaume (meme jour) : DATE ET HEURE DE DEPART dans le formulaire, chaque etape partant a « date de l'etape precedente + 1 jour » en REPRENANT l'heure de depart. Sort departureTime du hors-perimetre → les etapes generees ont desormais ETA, meteo par etape, et declenchent la dialog de synchro de date de fin de 17.12 via onAfterChange (comportement voulu, pas un effet de bord a neutraliser). PIEGE identifie : le client envoie deja un instant UTC (new Date(valeurDatetimeLocal).toISOString(), sidebar-stages-section.tsx:121) stocke dans une colonne timestamp SANS fuseau, donc ajouter 86 400 000 ms par etape decale l'heure murale d'une heure au passage a l'heure d'hiver ou d'ete (depart 08:00 le 24 octobre → 07:00 le 25) — et l'heure fausse part ensuite dans la prevision meteo de l'etape. L'exigence etant que l'heure soit reprise A L'IDENTIQUE, l'increment doit etre CALENDAIRE. D'ou : le client envoie firstDepartureAt (ISO) ET timeZone (IANA via Intl.DateTimeFormat().resolvedOptions().timeZone) — un instant seul ne permet pas au serveur de savoir que 2026-10-24T06:00Z veut dire « 08:00 a Paris » ; helper pur addDaysPreservingWallClock(baseIso, days, timeZone) dans packages/shared, SANS dependance ajoutee (le monorepo n'a ni date-fns ni luxon ni dayjs, tout est en Date natif ; mapWithConcurrency et poi-dedup donnent la convention du petit helper pur teste) : lecture de l'heure murale via Intl, increment de la DATE en arithmetique UTC (aucun DST sur une date nue), resolution de l'instant en deux passes d'offset. timeZone venant du CLIENT donc non fiable : un identifiant IANA invalide LEVE un RangeError a new Intl.DateTimeFormat → try/catch + repli 'UTC', sinon 500 sur une valeur bidon. Cas limites pinnes par tests : heure murale inexistante (02:30 au passage a l'heure d'ete) → resolution vers l'avant ; heure ambigue (retour a l'heure d'hiver) → premiere occurrence. Pre-remplissage du formulaire : date depuis adventure.startDate si elle existe sinon aujourd'hui, heure a DEFAULT_DEPARTURE_HOUR = 8 ; en mode « completer », date pre-remplie a derniere etape.departureTime + 1 jour. AUCUNE ecriture en retour dans adventure.startDate (lecture seule, pas d'ecriture cachee) ; la date de fin reste proposee par le flux 17.12 qui demande confirmation. Increment fixe a +1 jour meme pour une etape allongee a 120 km par le « +40 km » (coherent avec un objectif en km/JOUR ; les jours de repos = autre story). Les etapes lointaines auront un departureTime mais pas de meteo (horizon Open-Meteo) — degradation deja geree par le badge. | 2026-08-20 IMPLEMENTE (dev-story → review). Lot unique shared+api+web+mobile. GATE : shared 65 tests (6 fichiers, etait 41) · api 527/41 suites (etait 481/39) · web 1199/101 fichiers (etait 1182/100) · mobile 669/97 suites (etait 657/96) · turbo run test 10/10 · tsc 0 sur shared/api/mobile · tsc web 89 = BASELINE INCHANGEE (verifie par git stash push -u : 89 avant, 89 apres, toutes dans des fichiers de test preexistants) · eslint 0 erreur partout (2 warnings map-view preexistants, memes regles au baseline). ⚠️ 1re mesure de baseline faussee : `git stash push --keep-index` laisse les fichiers NON SUIVIS en place tout en retirant les modifications → etat incoherent (dialog present, import absent) et faux baseline de 98 ; `push -u` est la bonne commande. VERIFICATION QUE LA ROUTE TOURNE (regle 13) : POST /api/adventures/{uuid}/stages/generate → 401 (route matchee, guard rejette) tandis que POST .../stages/nonexistent → 404 — le contrôle par chemin frere prouve que le 401 vient du nouveau controleur et non d'une reponse d'auth servie a tout va. MESURES (pas des hypotheses) : increment calendaire 2026-10-24T06:00Z + 1 j = 2026-10-25T07:00Z, soit un saut de 25 h (un +86 400 000 aurait donne 07:00 locale) ; sur 5 etapes depuis le 22 octobre, exactement UN saut de 25 h et quatre de 24 h. Cas limites DST figes APRES mesure : heure murale inexistante (02:30 au printemps) → resolution vers l'avant 03:30 ; heure ambigue (02:30 a l'automne) → SECONDE occurrence 01:30Z — mon hypothese initiale « premiere occurrence » etait FAUSSE, corrigee sur la mesure, idempotence testee. Invariant facturation : billable === 0 asserte sur le cas nominal ET sur l'echec total du fournisseur ; le throw hors production verifie en simulant une fuite depuis le mock du provider ; verrou du masque = assertion sur l'en-tete X-Goog-FieldMask reellement emis + absence de pageToken + free:3/billable:0. TROIS BUGS DE MES PROPRES TESTS diagnostiques puis corriges sans toucher au code de prod : (1) web — pas d'auto-cleanup dans test-setup.ts, donc sans afterEach(cleanup) les requetes screen.* tapaient dans le dialog du test PRECEDENT (symptome trompeur : « adventureStartDate ignoree », qui passait en isolation) ; (2) mobile — RNTL 14 rend `render` asynchrone, sans await `screen` reste vide (« render function has not been called ») ; (3) mobile — deux fireEvent.press synchrones ne laissent pas React appliquer l'etat entre les deux (cocher un type puis soumettre repartait sur l'ancien etat) → userEvent, asynchrone, qui enveloppe chaque interaction dans un act. ECARTS ASSUMES vs story : GOOGLE_COUNT_CONCURRENCY et MAX_COUNT_REQUESTS_PER_GENERATION restent cote API (aucun client n'en a besoin) ; le warning mobile utilise le token density-medium (pas de token `warning`, et le contexte projet interdit une couleur en dur cote mobile) ; le mobile n'a pas de toast → encart dismissible sous le CTA. NON VERIFIE : aucune generation reelle executee (exige une aventure sur un compte authentifie) ni build simulateur (aucun module natif ajoute, donc pas de rebuild requis, mais le rendu sur device n'a pas ete observe). VALIDATION TERRAIN 2026-08-20 : T16a WEB (desktop) VALIDE par Guillaume — generation fonctionnelle sur une aventure reelle. T16b MOBILE = RESTE A TESTER, differe par Guillaume (aucun module natif ajoute → `pnpm sim` suffit, pas de prebuild ; le dialog n'a jamais ete observe sur device, seuls ses 12 tests unitaires le couvrent). T16c RELEVE DE FACTURATION GOOGLE = toujours ouvert, NON couvert par la validation web : les tests prouvent que le code ne DEMANDE que le masque IDs Only, seul le releve Cloud prouve que Google ne FACTURE rien (SKU Text Search Essentials IDs Only, 0,00 $, absence de plafond mensuel applicable). Story maintenue en review jusqu'a T16b + T16c. CORRECTIF DE SUITE (retour Guillaume apres la validation web) : le cartouche annoncait « ETA ~13h00 » pour une etape de 195 km partant a 08:00 — or ETA se lit comme une heure d'arrivee alors que la valeur affichee etait la DUREE (etaMinutes = roulage + pause) ; l'arrivee reelle est 21:00. Deux defauts distincts : (1) mauvais label → on distingue « Arrivee 21:00 · 13h de trajet » (depart connu) de « Duree 13h » (sinon) ; (2) format ambigu → formatDuration rend « 13h » et non « 13h00 » pour une duree pile, verrouille par un test explicite formatDuration(780) !== '13h00'. L'arrivee est DERIVEE, jamais stockee : computeStageArrival(departureTime, etaMinutes) dans packages/shared/src/utils/stage-timing.ts (9 tests) ; aucun changement d'API ni de schema. ⚠️ NUANCE A NE PAS « CORRIGER » PLUS TARD : ce helper ajoute des MILLISECONDES alors que addDaysPreservingWallClock incremente une DATE CIVILE — ce n'est pas une incoherence, une etape de 13 h qui traverse la nuit du changement d'heure dure reellement 13 h (son heure murale d'arrivee se decale) tandis que « le lendemain a la meme heure » est une notion civile ; un test couvre chacun des deux cas. Details : l'arrivee est DATEE quand elle tombe le lendemain (« ven. 21 aout · 04:00 »), sinon une etape de 10 h partie a 18:00 afficherait « Arrivee 04:00 » sans dire quel jour ; la pause reste mentionnee (deja comprise dans la duree) ; MODE LIVE, meme ambiguite sur la duree restante affichee nue (~2h15) → prefixee « dans ~2h15 ». Portee : shared (helper + 9 tests), web (stage-card.tsx + tests reecrits), mobile (stage-card.tsx, lib/format/stage.ts, i18n FR/EN). Une erreur tsc introduite par mon propre test (typage du mock onGenerate, ReturnType<typeof vi.fn> non assignable a la signature du prop) detectee par diff avant/apres et corrigee → web de retour a 89 = baseline. GATE APRES CORRECTIF : shared 74 · api 527 · web 1201 · mobile 669 · tsc 0 (shared/api/mobile), 89 = baseline (web) · eslint 0 erreur.

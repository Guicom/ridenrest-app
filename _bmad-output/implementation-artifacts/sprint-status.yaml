  17-14-poi-search-decouple-google-overpass: done  # 2026-08-19 dev-story → review. Suite de 17.13 : Google et Overpass etaient attendus ENSEMBLE, donc chacun payait le pire des deux (Google ~200 ms tiede / ~2 s froid ; Overpass mesure a 1,0 s / 8,9 s / 31,0 s selon l'etat des instances publiques, le pire venant d'un 504 sur overpass-api.de suivi d'une rotation vers une instance injoignable). Conception proposee par Guillaume ; ma proposition de reduire les timeouts a ete ecartee, a raison : une fois l'UI non bloquante, raccourcir ne ferait que jeter des resultats. Serveur : parametre source=google|overpass (resolveSourcePlan decide ce qu'on interroge ET ce qu'on masque a la lecture), chemin corridor reecrit en flux unique, live gere aussi ; absence du parametre = comportement combine historique (contrat mobile preserve). Provider : osm.ch RETIREE (extrait suisse — HTTP 200 + 0 resultat hors de Suisse, perte de donnees silencieuse ; 0 hotel mesure a Toulouse et Gerone), kumi.systems remplacee par private.coffee (URL renommee), budget global OVERPASS_TOTAL_BUDGET_MS 45 s (2 instances x (20 s + 2 x 30 s d'attente 429) tenaient une connexion plusieurs minutes), pause 429 portee a 30 s conformement a la politique d'overpass-api.de, [timeout:N] QL aligne sur le timeout client. Client web : une requete par (segment x calque x source), isPending et hasError ne suivent que la source primaire, auto-zoom sur le premier flux seulement, banniere « Aucun resultat » conditionnee par !overpassPending, composant ExtendedSearchStatus (non bloquant, seuil de lenteur 5 s, priorite a l'erreur). Correctif harnais : mockClear() ne purge pas les mockResolvedValueOnce en attente — elles fuyaient entre tests et masquaient le nombre d'instances (passe a mockReset() + OVERPASS_INSTANCES.length). Gate : api 200/200 sur src/pois · web 1170/1170 (100 fichiers) · tsc 0 api · eslint 0 err. Valide en navigateur : 2 requetes emises a la meme milliseconde (source=google et source=overpass), statut « plus longue que prevu » a t+8,5 s, compteurs complets a t+20 s. T9b/T10/T11 (2e passe, demandes Guillaume) : (T9b) maps.mail.ru REINTEGREE en dernier recours — ~50 % d'echecs et 10-14 s de plancher mesures, mais private.coffee est tombee en fetch failed le soir meme alors qu'elle repondait le matin : sans 3e instance, un incident sur overpass-api.de ne laisse aucune issue, et l'UI n'attend plus. (T10) COUT GOOGLE : le prefetch demandait un field mask Pro (note/horaires/telephone/site) pour CHAQUE POI insere alors qu'un pin n'a besoin que de nom+position+types ; Google facturant au SKU le plus eleve des champs demandes, on payait du Place Details Pro (5 000 gratuits/mois puis ~17 $/1000) pour des champs jamais lus. Mesure : recherche froide = 37 place_id, 14 appels factures, dont ~8 pour le calque restaurants non active. Correctif : getPlaceDetails(placeId, tier) + cles Redis distinctes google_place_basic (Essentials, prefetch) et google_place_details (Pro, fiche POI) ; une charge Pro deja en cache est reutilisee. Text Search reste gratuit (places.id seul). (T11) MODE LIVE decouple a parite : useLivePoisSearch emet 2 useQuery enabled:false, refetch() declenche les deux (Overpass seulement si l'option est active), isFetching/isError ne suivent que la source primaire, pois fusionne, banniere « Aucun resultat » conditionnee par !overpassPending, ExtendedSearchStatus monte. Mobile inchange (pas de parametre source) mais beneficie gratuitement de tout le travail serveur. GATE COMPLETE monorepo : api 462/462 (39 suites) · web 1173/1173 (100 fichiers) · mobile 632/632 (95 suites) · packages 89/89 · tsc 0 (api+mobile) · eslint 0 err (3 warnings preexistants verifies par stash). ⏳ T9 validation parcours complet Guillaume. | 2026-08-20 DONE — déployé en prod (PR #11, sha 822adef), T9 validé par Guillaume.

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride'n'Rest — Dark Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap');
  :root { --font-sans: 'Montserrat', system-ui, -apple-system, sans-serif; }
  html, body { margin: 0; padding: 0; font-family: var(--font-sans); }
  @keyframes rnr-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
  code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: .92em; }
  .strava-mark svg { height: 15px; width: auto; display: block; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ThemePanel.jsx"></script>
<script type="text/babel">
  const W = 620, H = 1660;
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="dark-ds" title="Ride'n'Rest — Dark Mode" subtitle="Webapp · 3 directions à comparer · vert #2D6A4A revisité pour fond sombre">
          <DCArtboard id="foret"   label="A · Forêt Nuit"  width={W} height={H}><ThemePanel t={THEMES.foret} /></DCArtboard>
          <DCArtboard id="charbon" label="B · Charbon"     width={W} height={H}><ThemePanel t={THEMES.charbon} /></DCArtboard>
          <DCArtboard id="minuit"  label="C · Minuit"      width={W} height={H}><ThemePanel t={THEMES.minuit} /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
